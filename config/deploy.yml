service: mancala-ai
image: "<%= ENV.fetch("KAMAL_IMAGE") %>"
minimum_version: 2.5.2
require_destination: true

ssh:
  user: "<%= ENV.fetch("KAMAL_SSH_USER", "root") %>"
  port: <%= ENV.fetch("KAMAL_SSH_PORT", "22") %>

servers:
  web:
    hosts:
      - "<%= ENV.fetch("KAMAL_HOST") %>"
    proxy: false
    options:
      publish: "<%= ENV.fetch("KAMAL_WIREGUARD_IP") %>:80:8080"
      memory: "<%= ENV.fetch("KAMAL_MEMORY", "2g") %>"
      cpus: "<%= ENV.fetch("KAMAL_CPUS", "2.0") %>"
      health-cmd: "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/health/ready\", timeout=3)'"
      health-interval: 10s
      health-timeout: 5s
      health-start-period: 120s
      health-retries: 12
      stop-timeout: 45

env:
  clear:
    MANCALA_AI_CONFIG: /assets/service.json

volumes:
  - "<%= ENV.fetch("MANCALA_AI_ASSET_RELEASE") %>:/assets:ro"

builder:
  arch: amd64
  driver: "<%= ENV.fetch("KAMAL_BUILDER_DRIVER", "docker-container") %>"

deploy_timeout: 180
readiness_delay: 120
drain_timeout: 45
registry:
  server: "<%= ENV.fetch("KAMAL_REGISTRY_SERVER") %>"
  username: "<%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>"
  password:
    - KAMAL_REGISTRY_PASSWORD
