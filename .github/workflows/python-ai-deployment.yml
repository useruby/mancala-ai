name: Python AI Deployment

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Gemfile"
      - "Gemfile.lock"
      - "config/deploy*.yml"
      - "deploy/**"
      - "ml/alphazero_lite/**"
      - "model-artifact/current/**"
      - "model-artifact/runtime/**"
      - "docs/ai-service/**"
      - ".github/workflows/python-ai-deployment.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Gemfile"
      - "Gemfile.lock"
      - "config/deploy*.yml"
      - "deploy/**"
      - "ml/alphazero_lite/**"
      - "model-artifact/current/**"
      - "model-artifact/runtime/**"
      - "docs/ai-service/**"
      - ".github/workflows/python-ai-deployment.yml"

jobs:
  container-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: |
            deploy/requirements-test.txt
      - name: Install pinned serving, test, and quality dependencies
        run: python -m pip install -r deploy/requirements-test.txt
      - name: Build native exact-root probe and verify committed identity
        run: |
          actual=$(sha256sum model-artifact/runtime/kalah_v1_tablebase | cut -d' ' -f1)
          test "$actual" = d898ed68e5d8a5aade35c2f148efd758478ef1c27bed934ba601b9aa353b1e48
          test -x model-artifact/runtime/kalah_v1_tablebase
          test "$(sha256sum model-artifact/runtime/kalah_v1_21.kvtb | cut -d' ' -f1)" = f126f64be2010abae6bd5f3b369b40a1cb7497b5f6903914c7ba9be0037a41a7
      - name: Serving and asset regressions
        run: |
          python -m pytest deploy/test_assemble_release.py \
            ml/alphazero_lite/test_serving_http.py \
            ml/alphazero_lite/test_serving_workers.py \
            ml/alphazero_lite/test_serving_engine.py \
            ml/alphazero_lite/tests/test_ai_service_contract.py \
            ml/alphazero_lite/test_native_exact_root_tablebase.py
      - name: Assemble authenticated CI release
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp/deploy-ci"
          python deploy/assemble_release.py deploy/ci-release-manifest.json "$GITHUB_WORKSPACE/.tmp/deploy-ci/release"
          ln -s release "$GITHUB_WORKSPACE/.tmp/deploy-ci/current"
      - name: Smoke-test packaged real assets through Uvicorn and supervised workers
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
        run: python deploy/test_real_assets.py "$GITHUB_WORKSPACE/.tmp/deploy-ci/release"
      - name: Build production image
        run: docker build --pull --tag "mancala-ai:${GITHUB_SHA}" .
      - name: Exercise real Uvicorn, Pebble workers, model, and native exact-root over HTTP
        env:
          MANCALA_TEST_IMAGE: mancala-ai:${{ github.sha }}
        run: python deploy/test_container.py "$GITHUB_WORKSPACE/.tmp/deploy-ci/release"
      - name: Python quality gate for deployment code
        run: |
          python -m ruff check deploy
          python -m ruff format --check deploy
          git diff --check

  kamal-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: deploy/requirements-test.txt
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true
      - name: Install Python config test dependencies
        run: python -m pip install -r deploy/requirements-test.txt
      - name: Validate mancala-ai destination with pinned Kamal 2.5.2
        env:
          KAMAL_HOST: 192.0.2.1
          KAMAL_WIREGUARD_IP: 192.0.2.1
          MANCALA_AI_ASSET_RELEASE: /srv/mancala-ai/releases/ci-release
          KAMAL_IMAGE: useruby/mancala-ai
          KAMAL_REGISTRY_SERVER: ghcr.io
          KAMAL_REGISTRY_USERNAME: deployment-validation
          KAMAL_REGISTRY_PASSWORD: validation-only
        run: |
          bundle exec kamal config -d mancala-ai
          python -m pytest deploy/test_kamal_config.py -q

  kamal-lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: deploy/requirements-test.txt
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true
      - name: Install test dependencies
        run: |
          python -m pip install -r deploy/requirements-test.txt
          mkdir -p "$GITHUB_WORKSPACE/.tmp/lifecycle"
      - name: Start disposable SSH deployment target and authenticated registry
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/kamal-test-key"
          sudo useradd --create-home --shell /bin/bash kamaltest
          sudo usermod -aG docker kamaltest
          sudo install -d -m 700 -o kamaltest -g kamaltest /home/kamaltest/.ssh
          sudo install -m 600 -o kamaltest -g kamaltest "$RUNNER_TEMP/kamal-test-key.pub" /home/kamaltest/.ssh/authorized_keys
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222 -o PidFile="$RUNNER_TEMP/sshd.pid" -o PasswordAuthentication=no -o PermitRootLogin=no
          mkdir -p ~/.ssh
          printf 'Host 127.0.0.1\n  Port 2222\n  IdentityFile %s\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' "$RUNNER_TEMP/kamal-test-key" >> ~/.ssh/config
          docker run --rm httpd:2.4-alpine htpasswd -Bbn testuser testpassword > "$RUNNER_TEMP/registry-auth"
          docker run -d --name kamal-test-registry -p 5000:5000 \
            -e REGISTRY_AUTH=htpasswd \
            -e REGISTRY_AUTH_HTPASSWD_REALM='Kamal lifecycle test' \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            -v "$RUNNER_TEMP/registry-auth:/auth/htpasswd:ro" registry:2
          for attempt in $(seq 1 30); do
            if curl -fsS -u testuser:testpassword -o /dev/null http://127.0.0.1:5000/v2/; then break; fi
            sleep 1
          done
          curl -fsS -u testuser:testpassword -o /dev/null http://127.0.0.1:5000/v2/
      - name: Exercise real Kamal deploy, rollback, failed-start recovery, and immutable assets
        env:
          KAMAL_HOST: kamaltest@127.0.0.1
          KAMAL_WIREGUARD_IP: 127.0.0.1
          MANCALA_AI_ASSET_RELEASE: ${{ github.workspace }}/.tmp/lifecycle/initial-assets
          KAMAL_IMAGE: mancala-ai
          KAMAL_REGISTRY_SERVER: 127.0.0.1:5000
          KAMAL_REGISTRY_USERNAME: testuser
          KAMAL_REGISTRY_PASSWORD: testpassword
          KAMAL_BUILDER_DRIVER: docker
          MANCALA_AI_DEPLOY_STATE: ${{ github.workspace }}/.tmp/lifecycle/state
          MANCALA_AI_DEPLOY_LOCK: ${{ github.workspace }}/.tmp/lifecycle/lock
          TMPDIR: ${{ github.workspace }}/.tmp
        run: |
          mkdir -p .kamal
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$KAMAL_REGISTRY_PASSWORD" > .kamal/secrets.mancala-ai
          chmod 600 .kamal/secrets.mancala-ai
          python -m deploy.test_kamal_lifecycle "$GITHUB_WORKSPACE/ml/alphazero_lite/fixtures/incumbent_forensic_proxy_current"
      - name: Stop disposable target and registry
        if: always()
        run: |
          docker ps -aq --filter label=service=mancala-ai | xargs -r docker rm -f || true
          docker rm -f kamal-test-registry || true
          if test -f "$RUNNER_TEMP/sshd.pid"; then sudo kill "$(<"$RUNNER_TEMP/sshd.pid")" || true; fi
